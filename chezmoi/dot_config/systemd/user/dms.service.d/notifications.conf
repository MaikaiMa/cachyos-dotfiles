# The own bar owns org.freedesktop.Notifications (ADR-0028). The packaged unit
# is Type=dbus, which makes systemd start DMS only once it holds that name; with
# Type=simple DMS starts when the bar's readiness wait ends. The packaged
# BusName= stays: systemd 262 rejects an empty BusName= ("Invalid bus name")
# and only Type=dbus waits for the name. DMS still registers the name itself
# whenever the bar is not running (scripts/bar-switch.sh dms).
#
# DMS is Quickshell too and takes the name the moment it is free. The bar's own
# start hooks (bar-notifications release and claim, in quickshell-bar.service)
# stop DMS before the bar starts and start it again once the bar holds the
# name, for a login, a manual restart and a crash restart alike. There is no
# PartOf=: stopping the bar alone leaves DMS running, and DMS re-registers the
# name by itself.
[Service]
Type=simple
