# The own bar owns org.freedesktop.Notifications (ADR-0028). The packaged unit
# is Type=dbus, which makes systemd start DMS only once it holds that name; with
# Type=simple DMS starts when the bar's readiness wait ends. The packaged
# BusName= stays: systemd 262 rejects an empty BusName= ("Invalid bus name")
# and only Type=dbus waits for the name. DMS still registers the name itself
# whenever the bar is not running (scripts/bar-switch.sh dms).
#
# DMS is Quickshell too and takes the name the moment it is free, so a bar
# restart on its own would hand the name to DMS in the gap, and the bar could
# not get it back. PartOf= propagates a restart or stop of the bar to DMS; with
# the bar's Before=dms.service, DMS stops before the bar stops and starts after
# the bar holds the name. So `systemctl --user restart quickshell-bar.service`
# keeps the name with the bar. An automatic restart after a bar crash
# (Restart=on-failure) does not propagate: after a crash DMS may hold the name
# until `scripts/bar-switch.sh own` is run. `scripts/bar-switch.sh status`
# shows the owner.
[Unit]
PartOf=quickshell-bar.service

[Service]
Type=simple
