[config]

[templates]

[templates.z13_window]
input_path = "~/.config/matugen/templates/z13-window-color"
output_path = "~/.cache/matugen/z13-window-color"
post_hook = "~/.local/bin/sync-z13-window-color '{{ colors.primary.default.hex_stripped }}'"

[templates.niri_backdrop]
input_path = "~/.config/matugen/templates/niri-backdrop"
output_path = "~/.config/niri/matugen/backdrop.kdl"

# Ghostty reloads on SIGUSR2, sent by the ghostty-colors.path user unit when
# this file or DMS's themes/dankcolors changes. Not a post hook here: matugen
# renders templates in no fixed order, so a hook could fire before dankcolors.
[templates.ghostty_background]
input_path = "~/.config/matugen/templates/ghostty-background"
output_path = "~/.config/ghostty/dank-background"

[templates.zen_colors]
input_path = "~/.config/matugen/templates/zen-colors"
output_path = "~/.config/zen/dms-colors.css"

# Vicinae only rescans its theme directory when a file is added or removed, and
# matugen rewrites in place; `theme set` rescans and reloads without starting it.
[templates.vicinae_theme]
input_path = "~/.config/matugen/templates/vicinae-theme"
output_path = "~/.local/share/vicinae/themes/dms.toml"
post_hook = 'sh -c "command -v vicinae >/dev/null 2>&1 && vicinae theme set dms >/dev/null 2>&1 || true"'

# Hylki is a Flatpak: its GTK reads $XDG_CONFIG_HOME/gtk-4.0/gtk.css inside
# the sandbox, which Flatpak maps to this directory, so the file is written
# there and no filesystem override is needed. See docs/mail.md.
[templates.hylki_gtk]
input_path = "~/.config/matugen/templates/hylki-gtk"
output_path = "~/.var/app/co.hyprlab.Hylki/config/gtk-4.0/gtk.css"
