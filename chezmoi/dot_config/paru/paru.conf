#
# ~/.config/paru/paru.conf
#
# paru reads only the first config it finds, so this file replaces
# /etc/paru.conf completely and repeats the CachyOS defaults. The one change
# is NewsOnUpgrade: unread Arch news is printed before every system upgrade,
# so a manual `paru -Syu` gets the same warning as `system-update`.
#
# See the paru.conf(5) manpage for options

#
# GENERAL OPTIONS
#
[options]
PgpFetch
Devel
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil
NewsOnUpgrade
#AurOnly
#BottomUp
#RemoveMake
#SudoLoop
#UseAsk
#SaveChanges
#CombinedUpgrade
#CleanAfter
#UpgradeMenu

#LocalRepo
#Chroot
#Sign
#SignDb
#KeepRepoCache

#
# Binary OPTIONS
#
#[bin]
#FileManager = vifm
#MFlags = --skippgpcheck
#Sudo = doas
