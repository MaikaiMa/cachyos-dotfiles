[shell.animation]
enabled = true
speed = 1.15

[shell.shadow]
direction = "center"
alpha = 0.60

[shell.panel]
transparency_mode = "glass"
control_center_placement = "floating"
control_center_position = "auto"
floating_offset = 12
open_near_click_control_center = true

[bar]
order = ["dotfiles", "default"]

# Keep Noctalia's built-in bar available as a disabled fallback. The Settings
# UI can enable it and disable the dotfiles bar without changing this file.
[bar.default]
enabled = false

[bar.dotfiles]
enabled = true
position = "top"
thickness = 34
background_opacity = 0.72
border = "outline"
border_width = 0.0
radius = 16
margin_ends = 12
margin_edge = 4
padding = 4
widget_spacing = 6
shadow = false
start = ["dotfiles_launcher", "dotfiles_gap", "dotfiles_taskbar"]
center = ["dotfiles_weather", "group:clock", "dotfiles_battery"]
end = [
    "dotfiles_media",
    "dotfiles_gap_media_tray",
    "group:tray",
    "dotfiles_gap",
    "group:system",
    "dotfiles_gap",
    "dotfiles_privacy",
    "dotfiles_notifications",
    "dotfiles_session",
]

[[bar.dotfiles.capsule_group]]
id = "clock"
members = ["dotfiles_clock"]
fill = "surface_variant"
border = ""
foreground = "on_surface"
padding = 10.0
opacity = 0.78
widget_spacing = 6

[[bar.dotfiles.capsule_group]]
id = "tray"
members = ["dotfiles_tray"]
fill = "surface_variant"
border = ""
foreground = "on_surface"
padding = 8.0
opacity = 0.78
widget_spacing = 6

[[bar.dotfiles.capsule_group]]
id = "system"
members = [
    "dotfiles_volume",
    "dotfiles_brightness",
    "dotfiles_bluetooth",
    "dotfiles_network",
    "dotfiles_power_profile",
]
fill = "surface_variant"
border = ""
foreground = "on_surface"
padding = 8.0
opacity = 0.78
widget_spacing = 6

[widget.dotfiles_gap]
type = "spacer"
length = 6

[widget.dotfiles_gap_media_tray]
type = "spacer"
length = 12

[widget.dotfiles_launcher]
type = "launcher"
glyph = "layout-grid"
capsule = true
capsule_fill = "primary"
capsule_foreground = "on_primary"

[widget.dotfiles_taskbar]
type = "taskbar"
group_by_workspace = true
hide_empty_workspaces = true
item_spacing = 6
occupied_color = "surface_variant"

[widget.dotfiles_clock]
type = "clock"
format = "{:%H:%M} · {:%e %b}"

[widget.dotfiles_weather]
type = "weather"
show_condition = false

[widget.dotfiles_battery]
type = "battery"

[widget.dotfiles_media]
type = "media"
hide_when_no_media = true
title_scroll = "on_hover"

[widget.dotfiles_tray]
type = "tray"

[widget.dotfiles_volume]
type = "volume"
show_label = false

[widget.dotfiles_brightness]
type = "brightness"
show_label = false

[widget.dotfiles_bluetooth]
type = "bluetooth"

[widget.dotfiles_network]
type = "network"
show_label = false

[widget.dotfiles_power_profile]
type = "power_profile"

[widget.dotfiles_power_profile.actions]
left = "panel-toggle control-center power"

[widget.dotfiles_privacy]
type = "privacy"
hide_inactive = true

[widget.dotfiles_notifications]
type = "notifications"

[widget.dotfiles_session]
type = "session"
capsule = true
capsule_fill = "error"
capsule_foreground = "on_error"
